# Fly.io config for the multiplayer server. Deploy from the repo root with
# `fly launch` (first time) or `fly deploy` (after) — the Dockerfile path
# below is relative to this file's directory (the repo root), matching how
# server/Dockerfile expects its build context.
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
